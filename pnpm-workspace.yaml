update:
  githubActions: true

autoDedupe: true
saveTypes: true

skills:
  dirs:
    - .claude/skills

allowBuilds:
  esbuild: true
  lefthook: true
  msw: false

trustPolicyExclude:
  - "semver@6.3.1 || 5.7.2" # https://github.com/npm/node-semver/issues/838

permissions:
  "@tanstack/react-router":
    skills: true
  "@tanstack/react-start":
    skills: true
